spring.application.name=job-portal
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_portal?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.port=${PORT:8080}
server.error.include-message=never
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.seed.enabled=${SEED_DEMO_DATA:true}
app.demo.admin-email=${DEMO_ADMIN_EMAIL:admin@demo.com}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:Admin@123}
